<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
<title id="title">Genta Ameku</title>
<desc id="desc">AI Enablement Engineer and Front-end Tech Lead. G.A Design &amp; Code.</desc>
<style>
.label{font:600 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:4px;fill:#9198a1}
.name{font:700 76px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#f0f6fc}
.role{font:500 30px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#d1d7e0}
.caret{fill:#fff100;animation:blink 1.1s steps(1) infinite,hue 16s 1.3s linear infinite}
.marker{fill:#fff100;fill-opacity:0.9;transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:draw .9s .4s cubic-bezier(.2,.7,.2,1) forwards,hue 16s 1.3s linear infinite}
@keyframes draw{to{transform:scaleX(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes hue{0%,20%{fill:#fff100}25%,45%{fill:#ff96f8}50%,70%{fill:#8ce5ff}75%,95%{fill:#96ff7e}100%{fill:#fff100}}
@media (prefers-reduced-motion:reduce){.marker{animation:none;transform:none}.caret{animation:none}}
</style>
<text class="label" x="450" y="66" text-anchor="middle">G.A DESIGN &amp; CODE</text>
<text class="name" x="450" y="150" text-anchor="middle" textLength="520" lengthAdjust="spacing">Genta Ameku<tspan class="caret">_</tspan></text>
<rect class="marker" x="140" y="217" width="620" height="5" rx="2.5"/>
<text class="role" x="450" y="208" text-anchor="middle" textLength="610" lengthAdjust="spacing">AI Enablement Engineer · Front-end Tech Lead</text>
</svg>
